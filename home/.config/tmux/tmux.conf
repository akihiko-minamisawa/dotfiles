unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on

set -s set-clipboard on

set -g allow-passthrough on

# Let nvim see focus changes (window switches) so it can redraw images
set -g focus-events on

# snacks.nvim images: force kitty unicode placeholders inside tmux. Direct
# placement garbles across tmux redraws; placeholders live in text cells and
# survive them. Needs a placeholder-capable terminal (WezTerm-dev / ghostty /
# kitty) — snacks hardcodes wezterm as incapable, hence the two overrides.
# Stock wezterm was already broken inside tmux either way; outside tmux
# these have no effect.
setenv -g SNACKS_WEZTERM 0
setenv -g SNACKS_KITTY 1

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap panes
bind -r < swap-pane -U
bind -r > swap-pane -D

# Join current pane into window N, side-by-side (prefix g -> number -> Enter)
bind g command-prompt -p "join to window:" "join-pane -h -t :%%"

# Pane border: show current directory on top, highlight active pane
set -g pane-border-status top
set -g pane-border-format " #{pane_current_path} "
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour45


# Tab bar (window list) — browser-like tabs at the top
set -g status-position top          # status bar at the top of the screen
set -g status-justify left          # left-align tabs (centre to center them)
set -g base-index 1                 # number tabs from 1
setw -g pane-base-index 1
set -g renumber-windows on          # compact the numbering when a tab closes

# Tab labels
setw -g window-status-format         ' #I:#{b:pane_current_path} [#{pane_current_command}] '
setw -g window-status-current-format ' #I:#{b:pane_current_path} [#{pane_current_command}] '
setw -g window-status-current-style  bg=colour45,fg=black,bold
setw -g window-status-style          fg=colour247
setw -g window-status-separator      ''

# Status bar colors
set -g status-interval 1            # redraw the top bar/borders every second
set -g status-style bg=colour235,fg=white
set -g status-left  ' #S '          # session name at the left edge
set -g status-left-style bg=colour240,fg=white

# Popup terminal
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Plugins (TPM) — pin the clone destination to ~/.tmux/plugins, outside this
# dotfiles repo
setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
# Don't auto-open the agent sidebar on new windows (toggle with prefix+e / prefix+E)
set -g @sidebar_auto_create off
run '~/.tmux/plugins/tpm/tpm'
