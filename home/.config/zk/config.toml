# Global zk configuration.
# Per-notebook config at <notebook>/.zk/config.toml is merged on top of this.

[note]
language = "ja"
filename = "{{id}}-{{slug title}}"
extension = "md"
template = "default.md"
id-charset = "alphanum"
id-length = 4
id-case = "lower"

[format.markdown]
hashtags = true
colon-tags = true
multiword-tags = false

[tool]
editor = "nvim"
shell = "zsh"
fzf-preview = "bat -p --color always {-1}"

[lsp.diagnostics]
wiki-title = "hint"
dead-link = "error"

# Daily journal group: notes under journal/ get date-based filenames + daily.md template.
[group.daily]
paths = ["journal"]
[group.daily.note]
filename = "{{format-date now}}"
extension = "md"
template = "daily.md"

[alias]
recent = "zk edit --sort modified- --limit 20 --interactive"
tags   = "zk tag list"
daily  = "zk new --no-input journal"
